grid">${other.map(x=>x.kind==="video"?`<figure><a class="media-video" href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">▶ Otevřít video</a><figcaption>${esc(x.label)} · <a href="${safe(x.source||n.url)}" target="_blank" rel="noopener noreferrer">Zdroj</a></figcaption></figure>`:imageCard(x)).join("")}</div>`:""}${shot?`<details><summary>Archivní snímek zdrojového článku (nikoliv aplikace)</summary><a href="${shot}" target="_blank" rel="noopener"><img src="${shot}" alt="Archivní snímek článku"></a></details>`:""}<h3>Zdroje a ověření</h3>${sources.map((s,j)=>`<p><a href="${safe(s)}" target="_blank" rel="noopener noreferrer">Podklad ${j+1} · ${esc(new URL(s).hostname)} ↗</a></p>`).join("")}${p.unknowns?`<p class="muted">${esc(p.unknowns)}</p>`:""}${d.changes?`<p class="muted">Změna oproti předchozí verzi: ${esc(d.changes)}</p>`:""}</article>`}
