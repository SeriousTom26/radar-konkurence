return `<button class="back" data-route="firm/${f.id}">← ${esc(f.name)}</button><article class="panel detail"><div class="firm">${mark(f)}<button class="back" style="margin:0" data-route="firm/${f.id}">${esc(f.name)}</button> ${tag(n.category)}</div><h1>${esc(n.title)}</h1><p class="muted">${n.baseline?"Existující funkce, nikoli novinka tohoto týdne":n.date?"Publikováno: "+dt(n.date):"Zachyceno: "+dt(n.detected)+" · datum vydání neznámé"} · ${esc(d.type||n.kind||"Produktový přehled")}</p><div class="notice">${esc(n.evidenceStatus||n.confidence||"Detail bude doplněn při sběru.")}${n.evidenceChecked?" · kontrola "+dt(n.evidenceChecked):""}</div>${sections.map(([k,v])=>`<h3>${k}</h3><p>${esc(v||"Zatím nedoloženo.")}</p>`).join("")}<h3>Vizuální dokumentace</h3>${shot?`<a href="${shot}" target="_blank" rel="noopener"><img src="${shot}" alt="Snímek veřejného článku"></a><p class="muted">Výřez veřejného článku · ${dt(n.screenshotDate)} · <a href="${safe(n.screenshotSource||n.url)}" target="_blank" rel="noopener noreferrer">zdroj</a>. Nejde nutně o obrazovku aplikace.</p>`:""}${gallery?`<div class="media-grid">${gallery}</div>`:""}${!shot&&!gallery?`<div class="placeholder">Dostupná obrazová ukázka zatím nebyla nalezena. Fiktivní screenshoty nepoužíváme.</div>`:""}<h3>Doklady a původní zdroj</h3>${n.sourceTitle?`<p><strong>${esc(n.sourceTitle)}</strong>${n.sourcePublished?" · "+dt(n.sourcePublished):""}</p>`:""}${n.sourceExcerpt?`<blockquote>${esc(n.sourceExcerpt)}…</blockquote><p class="muted">Krátký úryvek v původním jazyce.</p>`:""}${n.sourceHeadings?.length?`<details><summary>Obsah článku</summary><ul>${n.sourceHeadings.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}<a class="source" href="${safe(n.url)}" target="_blank" rel="noopener noreferrer">Otevřít původní zdroj ↗</a><p class="muted">${esc(n.source||"Veřejný zdroj")}</p></article>`}
function report(){const reports=DATA.reports||[];let r=reports[0];return `<div class="eyebrow">TÝDENNÍ ARCHIV</div><h1>Týdenní report</h1><p>Souhrn změn za ukončené sledované období. Nová vydání se ukládají do archivu.</p>${reports.length?reports.map((r,i)=>`<section class="panel report"><div class="section" style="margin:0"><h2>${dt(r.start)} – ${dt(r.end)}</h2><span class="tag">${r.ids.length} položek</span></div><p>${esc(r.note||'Automatický výběr z veřejných zdrojů.')}</p>${list(r.ids.map(id=>items.find(n=>n.id===id)).filter(Boolean))}${r.errors?.length?`<details><summary>Omezení sběru (${r.errors.length})</summary><p>${r.errors.map(esc).join('<br>')}</p></details>`:''}</section>`).join(''):'<div class="panel empty">První pravidelný report vznikne po spuštění GitHub Actions. Úvodní příklady najdete ve feedu.</div>'}`}
function render(){nav();let r=location.hash.slice(1)||'home',v=document.getElementById('view'),[type,id]=r.split('/');let f=type==='firm'?firm(id):null,n=type==='news'?items.find(n=>n.id===id):null;v.innerHTML=n?detail(n):type==='report'?report():feed(f);v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade');window.scrollTo(0,0);refreshCount()}function refreshCount(){const el=document.getElementById('count'),res=document.getElementById('results');if(!el||!res)return;let id=location.hash.slice(1).split('/')[1],arr=filtered(id?items.filter(n=>n.company===id):items);el.textContent=arr.length+' položek';res.innerHTML=list(arr)}document.addEventListener('click',e=>{let b=e.target.closest('[data-route]');if(b){cat='all';query='';period='all';go(b.dataset.route)}let c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===cat));refreshCount()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;refreshCount()}});document.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;refreshCount()}});window.addEventListener('hashchange',render);document.getElementById('updated').textContent='Data: '+dt(DATA.updated);render();
</script></body></html>
