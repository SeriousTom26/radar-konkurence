function render(){nav();let r=location.hash.slice(1)||'home',v=document.getElementById('view'),[type,id]=r.split('/');let f=type==='firm'?firm(id):null,n=type==='news'?items.find(n=>n.id===id):null;v.innerHTML=n?detail(n):type==='report'?report():feed(f);v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade');window.scrollTo(0,0);refreshCount()}function refreshCount(){const el=document.getElementById('count'),res=document.getElementById('results');if(!el||!res)return;let id=location.hash.slice(1).split('/')[1],arr=filtered(id?items.filter(n=>n.company===id):items);el.textContent=arr.length+' položek';res.innerHTML=list(arr)}document.addEventListener('click',e=>{let b=e.target.closest('[data-route]');if(b){cat='all';query='';period='all';go(b.dataset.route)}let c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===cat));refreshCount()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;refreshCount()}});document.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;refreshCount()}});window.addEventListener('hashchange',render);document.getElementById('updated').textContent='Data: '+dt(DATA.updated);render();
