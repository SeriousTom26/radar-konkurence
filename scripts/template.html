<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar konkurence</title><style>
.features{padding:15px 20px;background:#f3f6fa;border-radius:10px;margin:15px 0}.features h4{margin:0 0 8px;font-size:14px}.features ul{margin:0;padding-left:20px}.features li{margin:5px 0;line-height:1.55}.source-list{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.source-list a{background:#f3f6fa;padding:8px 12px;border-radius:7px;font-size:12px;text-decoration:none}.detail p{white-space:pre-line}

:root{--bg:#f3f5f8;--ink:#162437;--sub:#65748a;--line:#e1e7ee;--blue:#2465df;--nav:#14243a;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}button{color:inherit}a{color:var(--blue)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #75a7ff;outline-offset:3px}.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}aside{background:var(--nav);color:white;padding:30px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin:0 0 34px 8px}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{color:#a5b5cb;display:block;font-size:11px}.logo{background:#3478f5;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:24px}.navlabel{font-size:10px;font-weight:750;letter-spacing:1.5px;color:#93a4bc;margin:22px 12px 8px}.nav{width:100%;border:0;background:transparent;text-align:left;color:#c7d3e3;padding:11px 12px;border-radius:8px;display:flex;gap:12px;align-items:center;margin:2px 0}.nav:hover,.nav.active{background:#2b405d;color:white}.nav.active{box-shadow:inset 3px 0 #6ca3ff}.nav .dot{height:10px;width:10px;border-radius:3px;background:var(--c,#7da9ff);flex:none}.nav span:last-child{margin-left:auto;font-size:11px;color:#a9bad0}.main{padding:30px clamp(16px,4vw,52px) 60px;max-width:1550px;width:100%;margin:auto;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);gap:12px;font-size:12px;margin-bottom:30px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;color:var(--blue)}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.6px;line-height:1.12;margin:8px 0 9px}h2{font-size:21px;letter-spacing:-.5px;margin:0}p{margin:8px 0;color:var(--sub)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:26px 0}.metric,.panel{background:white;border:1px solid var(--line);border-radius:14px}.metric{padding:17px 18px}.metric .n{font-size:31px;line-height:1.15;font-weight:750;letter-spacing:-1px;margin:7px 0}.metric small{color:var(--sub)}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 0}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{background:white;border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:12px;font-weight:650}.pill.active{background:var(--blue);border-color:var(--blue);color:white}.search{margin-left:auto;min-width:140px;flex:0 1 230px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 12px}.panel{overflow:hidden}.list-head,.news{display:grid;grid-template-columns:105px 158px minmax(0,1fr) 110px 20px;gap:15px;align-items:center;padding:15px 19px}.list-head{background:#f9fafc;color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:750;border-bottom:1px solid var(--line)}.news{border:0;border-bottom:1px solid var(--line);background:white;width:100%;text-align:left;transition:background .15s;min-height:78px}.news:last-child{border:0}.news:hover{background:#f0f5ff}.date,.muted{color:var(--sub);font-size:12px}.firm{display:flex;gap:9px;align-items:center;font-weight:650;font-size:13px}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:white;background:var(--c);font-size:11px;font-weight:800;flex:none}.headline{font-weight:700;font-size:14px}.headline small{display:block;color:var(--sub);font-weight:400;margin-top:4px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.tag{display:inline-block;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:700;background:#e9efff;color:#315dbd;white-space:nowrap}.tag.soutez{background:#f2eaff;color:#7341a9}.tag.bonus{background:#fdf1df;color:#94601a}.arrow{font-size:20px;color:#8997ab}.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.empty{padding:42px;text-align:center;color:var(--sub)}.back{background:none;border:0;padding:0;color:var(--blue);font-weight:650;margin-bottom:20px}.detail{padding:26px;max-width:930px}.detail h1{font-size:32px}.detail p{color:var(--ink);font-size:15px;line-height:1.75}.detail .muted{color:var(--sub)}.detail h3{font-size:16px;margin:24px 0 8px}.detail img{max-width:100%;max-height:680px;display:block;border:1px solid var(--line);border-radius:10px;object-fit:contain}.placeholder{border:1px dashed #c7d2df;background:#f8fafc;padding:22px;border-radius:10px;color:var(--sub)}.source{display:inline-block;background:#edf3ff;border-radius:8px;padding:10px 14px;text-decoration:none;font-weight:700}.notice{padding:12px 15px;border:1px solid #d9e3f1;background:#edf3fb;border-radius:8px;font-size:12px;color:#455a77;margin:16px 0}.report{padding:20px 22px;margin-top:16px}.report li{margin:9px 0}.weekselect{padding:9px;border:1px solid var(--line);border-radius:8px;background:white}.fade{animation:fade .22s ease-out}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:850px){.shell{display:block}aside{position:relative;height:auto;padding:12px 14px}.brand{margin:0 0 8px}.navlabel{margin:12px 6px 3px}.navgroup{display:flex;overflow-x:auto;gap:4px}.nav{width:auto;white-space:nowrap;flex:none;padding:9px}.nav span:last-child{display:none}.main{padding-top:20px}.metrics{grid-template-columns:repeat(2,1fr)}.list-head{display:none}.news{grid-template-columns:1fr auto;gap:8px}.news .date{grid-column:1;grid-row:1}.news .firm{grid-column:1;grid-row:2}.news .headline{grid-column:1/-1;grid-row:3}.news .category{grid-column:2;grid-row:2}.news .arrow{display:none}.search{margin-left:0;flex:1}.top{margin-bottom:20px}}
.media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:16px 0}.media-grid figure{margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.media-grid img{width:100%;height:220px;object-fit:contain;background:white}.media-grid figcaption{font-size:12px;color:var(--sub);padding:8px 0}.media-video{display:grid;place-items:center;min-height:150px;border-radius:8px;background:#edf3ff;text-decoration:none;font-weight:700}.detail blockquote{margin:12px 0;padding:12px 18px;background:#f3f6fa;border-left:3px solid var(--blue);font-style:italic}.detail details{margin:14px 0;color:var(--sub)}
.about-game{margin:24px 0 18px}.about-game h2,.detail-heading{font-size:23px;margin:0 0 12px}.about-game p{line-height:1.8;margin:12px 0}.rule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0}.rule-card{background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:15px 18px}.rule-card h3{margin:0 0 8px;font-size:15px;color:#315dbd}.rule-card p{font-size:14px;line-height:1.65;margin:0}.screen-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px;margin:15px 0 24px}.screen-gallery figure{margin:0;border:1px solid var(--line);padding:10px;border-radius:12px;background:#f8fafc}.screen-gallery img{width:100%;height:360px;object-fit:contain;background:#fff}.screen-gallery figcaption{font-size:12px;color:var(--sub);padding:8px 0}.detail-heading{margin-top:30px}@media(max-width:600px){.rule-grid{grid-template-columns:1fr}.screen-gallery img{height:auto;max-height:520px}}
</style></head><body><div class="shell"><aside><div class="brand"><div class="logo">◈</div><div><strong>Radar konkurence</strong><small>PRODUCT INTELLIGENCE</small></div></div><div class="navlabel">PŘEHLED</div><div class="navgroup" id="mainnav"></div><div class="navlabel">SLEDOVANÉ FIRMY</div><div class="navgroup" id="firms"></div><div class="navlabel">PRODUKTOVÝ MONITOR</div></aside><main class="main"><div class="top"><span>Produktová analýza / Zahraniční trh</span><span id="updated"></span></div><div id="view"></div></main></div><script>
const DATA=/*__DATA__*/;const firms=DATA.companies,items=DATA.items;const cats={all:'Vše',komunita:'Komunita',soutez:'Soutěže',bonus:'Bonusy'};let cat='all',query='',period='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const firm=id=>firms.find(f=>f.id===id);const dt=s=>s?new Date(s.slice(0,10)+'T12:00:00').toLocaleDateString('cs-CZ'):'Bez data';const tag=c=>`<span class="tag ${esc(c)}">${cats[c]||c}</span>`;const mark=f=>`<span class="mark" style="--c:${f.color}">${esc(f.short)}</span>`;const nav=()=>{const r=location.hash.slice(1)||'home';document.getElementById('mainnav').innerHTML=[['home','▤','Všechny novinky'],['report','▧','Týdenní report']].map(([id,icon,name])=>`<button class="nav ${r===id?'active':''}" data-route="${id}">${icon} ${name}</button>`).join('');document.getElementById('firms').innerHTML=firms.map(f=>`<button class="nav ${r==='firm/'+f.id?'active':''}" data-route="firm/${f.id}"><i class="dot" style="--c:${f.color}"></i>${esc(f.name)}<span>${items.filter(n=>n.company===f.id&&!n.baseline).length}</span></button>`).join('')};function go(r){if(location.hash.slice(1)===r){render();return}location.hash=r}function list(arr){return `<div class="panel"><div class="list-head"><span>Datum</span><span>Společnost</span><span>Novinka</span><span>Oblast</span><span></span></div>${arr.length?arr.map(n=>{const f=firm(n.company);return `<button class="news" data-route="news/${n.id}"><span class="date">${n.baseline?'Přehled':dt(n.date||n.detected)}</span><span class="firm">${mark(f)}${esc(f.name)}</span><span class="headline">${esc(n.title)}<small>${esc(n.summary)}</small></span><span class="category">${tag(n.category)}</span><span class="arrow">›</span></button>`}).join(''):'<div class="empty">Pro zvolený filtr nejsou žádné položky.</div>'}</div>`}function toolbar(){return `<div class="toolbar"><div class="pills">${Object.entries(cats).map(([k,v])=>`<button class="pill ${cat===k?'active':''}" data-cat="${k}">${v}</button>`).join('')}</div><select id="period" class="weekselect"><option value="all" ${period==='all'?'selected':''}>Celý archiv</option><option value="week" ${period==='week'?'selected':''}>Posledních 7 dní</option><option value="baseline" ${period==='baseline'?'selected':''}>Existující produkty</option></select><input class="search" id="search" placeholder="Hledat novinku…" value="${esc(query)}"></div>`}function filtered(arr){return arr.filter(n=>(cat==='all'||n.category===cat)&&(period==='all'||(period==='baseline'?n.baseline:!n.baseline&&(n.date||n.detected)>=DATA.weekStart))&&(!query||[n.title,n.summary,firm(n.company).name].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>Number(a.baseline)-Number(b.baseline)||String(b.date||b.detected).localeCompare(String(a.date||a.detected)))}function cards(arr){const current=arr.filter(n=>!n.baseline&&(n.date||n.detected)>=DATA.weekStart);return `<div class="metrics">${[['Novinky za 7 dní',current.length],['Komunita',current.filter(n=>n.category==='komunita').length],['Soutěže',current.filter(n=>n.category==='soutez').length],['Bonusy',current.filter(n=>n.category==='bonus').length]].map(([k,v])=>`<div class="metric"><small>${k}</small><div class="n">${v}</div><small>Ve sledovaném období</small></div>`).join('')}</div>`}function feed(f){let arr=f?items.filter(n=>n.company===f.id):items;return `<div class="eyebrow">${f?esc(f.country):'8 sledovaných značek'}</div><h1>${f?esc(f.name):'Novinky konkurence'}</h1><p>${f?esc(f.note):'Komunita, soutěže a zákaznické bonusy na jednom místě.'}</p>${cards(arr)}${DATA.status!=='live'?'<div class="notice">Úvodní data: ověřené příklady a existující funkce. Automatický sběr dosud nebyl spuštěn.</div>':''}<div class="section"><h2>Produktový feed</h2><span class="muted" id="count"></span></div>${toolbar()}<div id="results">${list(filtered(arr))}</div>`}function detail(n){const f=firm(n.company),p=n.product||{},c=p.contest||{},d=n.description||{},m=n.media||[];
const safe=u=>{try{const x=new URL(u);return x.protocol==="https:"&&!x.username&&!x.password?esc(x.href):""}catch{return ""}};
const shot=n.screenshot&&/^screenshots\/[a-zA-Z0-9_.-]+\.png$/.test(n.screenshot)?esc(n.screenshot):"";
const screens=m.filter(x=>x.kind==="product_screen"&&safe(x.url)),other=m.filter(x=>x.kind!=="product_screen"&&safe(x.url));
const imageCard=x=>`<figure><a href="${safe(x.url)}" target="_blank" rel="noopener noreferrer"><img loading="lazy" referrerpolicy="no-referrer" src="${safe(x.url)}" alt="${esc(x.label)}"></a><figcaption>${esc(x.label)} · <a href="${safe(x.source||n.url)}" target="_blank" rel="noopener noreferrer">Oficiální zdroj ↗</a></figcaption></figure>`;
const about=c.about||[p.definition||d.what||n.summary,p.principle||d.how||n.detail].filter(Boolean).join("\n\n");
const rules=[["Vstup a podmínky účasti",c.entry],["Pravidla a vyhodnocení",c.scoring],["O co se hraje",c.prizes||p.rewards],["Harmonogram a dostupnost",c.schedule||p.availability||d.availability]];
return `<button class="back" data-route="firm/${f.id}">← ${esc(f.name)}</button><article class="panel detail"><div class="firm">${mark(f)}<button class="back" style="margin:0" data-route="firm/${f.id}">${esc(f.name)}</button> ${tag(n.category)}</div><h1>${esc(n.title)}</h1><p class="muted">${n.baseline?"Existující produkt":n.date?"Publikováno: "+dt(n.date):"Zachyceno: "+dt(n.detected)+" · datum vydání neznámé"} · ${esc(n.kind||"Produktový přehled")}</p><div class="notice">${esc(p.method||n.evidenceStatus||n.confidence||"Čeká na ověření")}</div><section class="about-game"><h2>${n.category==="soutez"?"O soutěži":"O produktu"}</h2>${about.split(/\n\s*\n/).map(v=>`<p>${esc(v)}</p>`).join("")}</section><div class="rule-grid">${rules.map(([label,v])=>`<section class="rule-card"><h3>${label}</h3><p>${esc(v||"Ve veřejných podkladech zatím nedoloženo.")}</p></section>`).join("")}</div>${p.features?.length?`<div class="features"><h4>Klíčové prvky produktu</h4><ul>${p.features.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}<h2 class="detail-heading">Reálné obrazovky produktu</h2>${screens.length?`<p class="muted">Obrazovky odkazované v oficiálních produktových průvodcích. Rozkliknutím se zobrazí originál; některé zdroje mohou omezit načítání.</p><div class="screen-gallery">${screens.map(imageCard).join("")}</div>`:`<div class="placeholder">Ověřená obrazovka aplikace zatím není k dispozici. Fiktivní makety ani fotografie článků zde nezobrazujeme.${n.screenReference?` <a href="${safe(n.screenReference.url)}" target="_blank" rel="noopener noreferrer">${esc(n.screenReference.label)}</a>`:""}</div>`}${other.length?`<h3>Další vizuály a videa</h3><div class="media-grid">${other.map(x=>x.kind==="video"?`<figure><a class="media-video" href="${safe(x.url)}" target="_blank" rel="noopener noreferrer">▶ Otevřít video</a><figcaption>${esc(x.label)} · <a href="${safe(x.source||n.url)}" target="_blank" rel="noopener noreferrer">Zdroj</a></figcaption></figure>`:imageCard(x)).join("")}</div>`:""}${shot?`<details><summary>Archivní snímek zdrojového článku (nikoliv aplikace)</summary><a href="${shot}" target="_blank" rel="noopener"><img src="${shot}" alt="Archivní snímek článku"></a></details>`:""}<h3>Zdroje a ověření</h3>${[...new Set([...(p.sources||[]),c.source,n.url].filter(Boolean))].filter(s=>safe(s)).map((s,j)=>`<p><a href="${safe(s)}" target="_blank" rel="noopener noreferrer">Podklad ${j+1} · ${esc(new URL(s).hostname)} ↗</a></p>`).join("")}${p.unknowns?`<p class="muted">${esc(p.unknowns)}</p>`:""}${d.changes?`<p class="muted">Změna oproti předchozí verzi: ${esc(d.changes)}</p>`:""}</article>`}
function report(){const reports=DATA.reports||[];let r=reports[0];return `<div class="eyebrow">TÝDENNÍ ARCHIV</div><h1>Týdenní report</h1><p>Souhrn změn za ukončené sledované období. Nová vydání se ukládají do archivu.</p>${reports.length?reports.map((r,i)=>`<section class="panel report"><div class="section" style="margin:0"><h2>${dt(r.start)} – ${dt(r.end)}</h2><span class="tag">${r.ids.length} položek</span></div><p>${esc(r.note||'Automatický výběr z veřejných zdrojů.')}</p>${list(r.ids.map(id=>items.find(n=>n.id===id)).filter(Boolean))}${r.errors?.length?`<details><summary>Omezení sběru (${r.errors.length})</summary><p>${r.errors.map(esc).join('<br>')}</p></details>`:''}</section>`).join(''):'<div class="panel empty">První pravidelný report vznikne po spuštění GitHub Actions. Úvodní příklady najdete ve feedu.</div>'}`}
function render(){nav();let r=location.hash.slice(1)||'home',v=document.getElementById('view'),[type,id]=r.split('/');let f=type==='firm'?firm(id):null,n=type==='news'?items.find(n=>n.id===id):null;v.innerHTML=n?detail(n):type==='report'?report():feed(f);v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade');window.scrollTo(0,0);refreshCount()}function refreshCount(){const el=document.getElementById('count'),res=document.getElementById('results');if(!el||!res)return;let id=location.hash.slice(1).split('/')[1],arr=filtered(id?items.filter(n=>n.company===id):items);el.textContent=arr.length+' položek';res.innerHTML=list(arr)}document.addEventListener('click',e=>{let b=e.target.closest('[data-route]');if(b){cat='all';query='';period='all';go(b.dataset.route)}let c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===cat));refreshCount()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;refreshCount()}});document.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;refreshCount()}});window.addEventListener('hashchange',render);document.getElementById('updated').textContent='Data: '+dt(DATA.updated);render();
</script></body></html>
