name: Týdenní monitoring konkurence
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency:
  group: weekly-monitor
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect public changes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAPTURE_PUBLIC_SCREENSHOTS: 'false'
        run: python scripts/monitor.py
      - name: Enrich details and collect visual evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAPTURE_PUBLIC_SCREENSHOTS: ${{ vars.CAPTURE_PUBLIC_SCREENSHOTS || 'true' }}
        run: python scripts/enrich.py
      - run: python scripts/build.py
      - name: Save report and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data index.html screenshots
          if ! git diff --cached --quiet; then git commit -m "Weekly competitor intelligence $(date -u +%F)"; git push; fi
